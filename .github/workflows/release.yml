# Release, when the developer pushes a version tag (git tag vX.Y.Z && git push origin vX.Y.Z):
#   build:   check that the tag is the newest version of the change log, run the unit tests, write the GitHub Pages
#            site (npm run pages) and the release notes (from the change log)
#   release: publish a GitHub release with index.html and the site as a zip file, then start this workflow again on
#            main for the tag (the github-pages environment lets only main deploy, not tags)
#   pages:   deploy the site to GitHub Pages, in a run on main, only when Pages is set to deploy from GitHub Actions
#            (Settings › Pages › Build and deployment › Source: GitHub Actions); otherwise this job is skipped
# Run it by hand (Actions › Release › Run workflow) to deploy the site of the current main, or of a tag given as
# "tag", without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Deploy the site of this version tag (empty = the current main)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: version
        name: Version of the page (and of the tag)
        run: |
          v=$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' index.html)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag }}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ] && [ "$tag" != "v$v" ]; then
            echo "::error::The tag $tag is not the newest version of its change log (v$v)"
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - name: Site, release notes and files
        run: |
          npm run pages
          node scripts/gen-docs.ts --notes "${{ steps.version.outputs.version }}" > release-notes.md
          mkdir dist
          cp index.html dist/
          (cd site && zip -qr "../dist/sigmaomega-site-v${{ steps.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            release-notes.md
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: pages
        name: Is GitHub Pages set to deploy from GitHub Actions?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set to deploy from GitHub Actions, so the site is not deployed"
          fi

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made on GitHub's web page together with its tag gets the files, title and notes added
        run: |
          title="SigmaOmega v${{ needs.build.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file release-notes.md
          fi
      - name: Deploy the site of this tag from main (GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

  pages:
    needs: build
    # a run for a tag cannot deploy (the environment allows main only); its release job starts a run on main instead
    if: needs.build.outputs.pages == 'true' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
